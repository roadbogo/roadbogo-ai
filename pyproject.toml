[build-system]
requires = [
  "setuptools>=68",
  "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "roadbogo-ai"
version = "0.1.0"
description = "Roadbogo AI serving API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic-settings>=2.4.0",
  "pyyaml>=6.0.0",
  "python-multipart==0.0.32",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
inference = [
  "ultralytics-opencv-headless==8.4.101"
]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = [
  "tests*",
  "configs*",
  "models*"
]
namespaces = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]